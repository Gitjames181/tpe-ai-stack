worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/json;
    map_hash_bucket_size 256;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_authorization $ai_caller {
        default "";
        include /run/ai/tokens.conf;
    }
    log_format ai '$time_iso8601 caller=$ai_caller method=$request_method uri=$uri status=$status duration=$request_time request_id=$request_id';
    access_log /dev/stdout ai;
    limit_req_zone $ai_caller zone=ai_requests:1m rate=30r/m;
    limit_conn_zone $server_name zone=ai_active:1m;

    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 4m;
        limit_req_status 429;
        limit_conn_status 429;
        add_header X-Request-ID $request_id always;

        location = /healthz {
            access_log off;
            return 200 '{"status":"gateway_alive"}';
        }
        location = /readyz {
            if ($ai_caller = "") { return 401; }
            proxy_method POST;
            proxy_set_header Content-Type application/json;
            proxy_set_body '{"model":"tpe-code:latest"}';
            include /etc/nginx/ai-proxy.conf;
            proxy_pass http://127.0.0.1:11434/api/show;
        }
        location = /v1/models {
            if ($ai_caller = "") { return 401; }
            limit_except GET { deny all; }
            include /etc/nginx/ai-proxy.conf;
            proxy_pass http://127.0.0.1:11434;
        }
        location = /v1/chat/completions {
            if ($ai_caller = "") { return 401; }
            limit_except POST { deny all; }
            limit_req zone=ai_requests burst=5 nodelay;
            limit_conn ai_active 1;
            include /etc/nginx/ai-proxy.conf;
            proxy_pass http://127.0.0.1:11434;
        }
        location = /v1/messages {
            if ($ai_caller = "") { return 401; }
            limit_except POST { deny all; }
            limit_req zone=ai_requests burst=5 nodelay;
            limit_conn ai_active 1;
            include /etc/nginx/ai-proxy.conf;
            proxy_pass http://127.0.0.1:11434;
        }
        location @unavailable {
            return 503 '{"error":{"message":"TPE inference is unavailable","type":"service_unavailable"}}';
        }
        # No access to Ollama pull/create/delete or arbitrary proxy destinations.
        location / { return 404; }
    }
}
