user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Load dynamic modules
include /usr/lib/nginx/modules/*.conf;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Map bearer token to caller identity
    map_hash_bucket_size 256;
    map $http_authorization $ai_caller {
        default "";
        include /run/ai/tokens.conf;
    }

    # Logging format: ISO 8601 timestamp, caller identity, request details, duration
    log_format ai '$time_iso8601 caller=$ai_caller method=$request_method uri=$uri status=$status duration=$request_time request_id=$request_id';
    access_log /var/log/nginx/access.log ai;

    # Rate limiting zones
    limit_req_zone $ai_caller zone=ai_requests:1m rate=30r/m;
    limit_conn_zone $server_name zone=ai_active:1m;

    # Gzip compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;
    gzip_vary on;

    # Brotli compression (dynamic module)
    brotli on;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml text/javascript application/json application/javascript;

    # TLS session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Temp directories
    client_body_temp_path /var/cache/nginx/client_body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    # Virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
