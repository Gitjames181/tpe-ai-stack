# Proxy configuration included by all upstream proxy_pass directives
# Common headers, timeouts, buffering, error handling

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Authorization "";
proxy_set_header X-Api-Key "";
proxy_set_header Host localhost:11434;
proxy_set_header X-Request-ID $request_id;

# Streaming responses (never buffer)
proxy_buffering off;
proxy_cache off;

# Timeouts
proxy_connect_timeout 10s;
proxy_read_timeout 600s;
proxy_send_timeout 600s;

# Single pass (do not retry on peer failure)
proxy_next_upstream off;

# Error handling: catch 502/504 and return custom unavailable response
proxy_intercept_errors on;
error_page 502 504 = @unavailable;
