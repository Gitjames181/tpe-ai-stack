# ModSecurity Core Rule Set configuration
# Runs in detection-only mode: logs violations but does not block

SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFiles Off
SecRequestBodyProcessingLimit 1073741824

SecResponseBodyAccess On
SecResponseBodyLimit 1073741824

SecTmpDir /var/cache/nginx/modsecurity/tmp
SecDataDir /var/cache/nginx/modsecurity/data
SecAuditEngine On
SecAuditLogRelevantStatus "^(?:4|5)"
SecAuditLogParts ABDEFHIJZ
SecAuditLog /var/log/nginx/modsecurity_audit.log

SecArgumentsSeparator "&"
SecCookieFormat 0
SecUnicodeCodePage 1252

# OWASP CRS inclusion
Include /etc/nginx/owasp-crs/*.conf
Include /etc/nginx/owasp-crs/rules/*.conf
