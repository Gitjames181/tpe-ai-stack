name: ai-stack
services:
  tunnel:
    image: tpe-ai-tunnel:1.0.0
    build:
      context: .
      dockerfile: docker/tunnel/Dockerfile
      args:
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.24.4}
    restart: unless-stopped
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      VAST_SSH_HOST: ${VAST_SSH_HOST:?Set the Vast SSH host}
      VAST_SSH_PORT: ${VAST_SSH_PORT:?Set the mapped Vast SSH port}
      VAST_SSH_USER: ${VAST_SSH_USER:-root}
      VAST_SSH_PRIVATE_KEY_B64: ${VAST_SSH_PRIVATE_KEY_B64:-}
      VAST_SSH_KNOWN_HOSTS: ${VAST_SSH_KNOWN_HOSTS:-}
    ports:
      - "127.0.0.1:${AI_GATEWAY_PORT:-11435}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
      - /run/ai:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=10001,gid=10001
    networks:
      ai:
        aliases: [tpe-ai-api]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  gateway:
    image: tpe-ai-gateway:1.0.0
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.30.8-alpine}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: "service:tunnel"
    depends_on:
      tunnel:
        condition: service_started
    environment:
      TPE_AI_API_KEY: ${TPE_AI_API_KEY:-}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101
      - /run/ai:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=101,gid=101
    healthcheck:
      # Process liveness only; scripts/smoke.py checks authenticated inference.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  ai:
    name: tpe-ai
    driver: bridge
