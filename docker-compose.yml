name: ai-stack
services:
  tunnel:
    image: tpe-ai-tunnel:1.0.0
    build:
      context: .
      dockerfile: docker/tunnel/Dockerfile
      args:
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.24.4}
    restart: unless-stopped
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      VAST_SSH_HOST: ${VAST_SSH_HOST:?Set the Vast SSH host}
      VAST_SSH_PORT: ${VAST_SSH_PORT:?Set the mapped Vast SSH port}
      VAST_SSH_USER: ${VAST_SSH_USER:-root}
      VAST_SSH_PRIVATE_KEY_B64: ${VAST_SSH_PRIVATE_KEY_B64:-}
      VAST_SSH_KNOWN_HOSTS: ${VAST_SSH_KNOWN_HOSTS:-}
    ports:
      - "127.0.0.1:${AI_GATEWAY_PORT:-11435}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
      - /run/ai:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=10001,gid=10001
    networks:
      ai:
        aliases: [tpe-ai-api]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:latest
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      tunnel:
        condition: service_started
    networks:
      ai:
        aliases: [ollama-webui]
    ports:
      - "127.0.0.1:${OLLAMA_UI_PORT:-8081}:8080"
    environment:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      WEBUI_AUTH: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      WEBUI_DEFAULT_MODELS: tpe-code:latest
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/user/.local:rw,noexec,nosuid,nodev,size=512m,uid=1000,gid=1000
      - /app/backend/data:rw,noexec,nosuid,nodev,size=256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  ai:
    name: tpe-ai
    driver: bridge
