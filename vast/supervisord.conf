[unix_http_server]
file=/run/tpe-ai-supervisor.sock
chmod=0700

[supervisord]
nodaemon=false
logfile=/var/log/tpe-ai/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/run/tpe-ai-supervisor.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/tpe-ai-supervisor.sock

[program:ollama]
command=/usr/bin/python3 /opt/tpe-ai/serve.py
user=tpe-ai
environment=HOME="/home/tpe-ai"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/tpe-ai/ollama.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:bootstrap]
command=/usr/bin/python3 /opt/tpe-ai/bootstrap.py
user=tpe-ai
environment=HOME="/home/tpe-ai",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_NO_CLOUD="1"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/tpe-ai/bootstrap.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
stopasgroup=true
killasgroup=true
